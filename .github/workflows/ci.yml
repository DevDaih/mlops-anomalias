# CI: lint, testes, validação dos arquivos de monitoramento e build da imagem da API.
# Os dados do projeto são sintéticos; nenhum segredo é usado (só o GITHUB_TOKEN do job de build).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # GHCR exige o nome em minúsculas
  IMAGE: ghcr.io/devdaih/mlops-anomalias

jobs:
  checks:
    name: Lint, testes e configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest

      # .env de exemplo: copiado de .env.example (valor de placeholder, nunca uma senha real)
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

      # Usa as mesmas imagens do docker-compose.yml (fonte única da versão)
      - name: promtool check config e rules
        run: |
          image=$(docker compose config --format json | jq -r '.services.prometheus.image')
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            "$image" check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            "$image" check rules /etc/prometheus/alerts.yml

      - name: amtool check-config
        run: |
          image=$(docker compose config --format json | jq -r '.services.alertmanager.image')
          docker run --rm --entrypoint amtool \
            -v "$PWD/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            "$image" check-config /etc/alertmanager/alertmanager.yml

  build:
    name: Build da imagem da API
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .

      # Teste pós-build: sobe o container, espera o /health e confere um /predict normal
      - name: Teste do container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:$SHORT_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "API não ficou saudável em 30 s" >&2
              docker logs api
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          echo
          resp=$(curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H 'content-type: application/json' \
            -d '{"temperature": 70, "pressure": 5, "vibration": 2, "current": 15}')
          echo "$resp"
          echo "$resp" | jq -e '
            (.predictions | length) == 1
            and .predictions[0].is_anomaly == false
            and (.predictions[0].anomaly_score | type) == "number"
            and (.predictions[0].model_version | type) == "number"
          ' > /dev/null

      - name: Logs do container (em falha)
        if: failure()
        run: docker logs api || true

      # Só em push na main: pull_request apenas constrói e testa
      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
